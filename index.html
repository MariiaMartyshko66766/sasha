<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Система</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screen1" class="screen active">
  <h1>Саша</h1>
  <p>Вам пришло важное уведомление</p>
  <button onclick="next(2)">Открыть</button>
</div>

<div id="screen2" class="screen">
  <h1>Вопрос</h1>
  <p>Маша тебе нравится?</p>

  <div class="btn-row">
    <button class="yes" onclick="love()">Да</button>
    <button id="noBtn" class="no">Нет</button>
  </div>
</div>

<div id="screen3" class="screen">
  <h1>Испытание</h1>
  <p>Поймай 15 сердечек</p>

  <div id="gameArea"></div>
  <div id="score">0 / 15</div>
</div>

<div id="screen4" class="screen">
  <h1 id="resultTitle"></h1>
  <p id="resultText"></p>

  <button onclick="final()">Дальше</button>
</div>

<div id="screen5" class="screen">
  <img src="images/sasha.jpg" alt="">
  <h2>Система завершена</h2>
  <p>Поддержка: Маша</p>
</div>

<script src="script.js"></script>
</body>
</html>
